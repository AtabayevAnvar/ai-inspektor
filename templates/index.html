<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Inspektor AI — Yo'l harakati qoidalari maslahatchisi</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100%;
            height: 100dvh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #222222; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #333333; }

        /* ─── FLOATING SIDEBAR (290px) ─────────────────────── */
        .sidebar {
            width: 290px;
            background-color: #0F0F0F;
            border: 1px solid #222222;
            border-radius: 20px;
            margin: 12px 0 12px 12px;
            height: calc(100vh - 24px);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            padding: 16px 14px;
        }

        .sidebar.collapsed {
            margin-left: -310px;
        }

        /* Sidebar Logo */
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 6px 14px 6px;
        }

        .brand-icon-wrap {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-title {
            font-size: 15.5px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        /* New Chat Button */
        .new-chat-card {
            background-color: #161616;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 11px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #efefef;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .new-chat-card:hover {
            background-color: #1f1f1f;
            border-color: #333333;
            color: #ffffff;
        }

        /* Chat History List */
        .chat-list-scroll {
            flex: 1;
            overflow-y: auto;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 2px;
        }

        .chat-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            border-radius: 12px;
            color: #9c9c9c;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease;
            background-color: transparent;
            border: 1px solid transparent;
        }

        .chat-item-row:hover {
            background-color: #171717;
            color: #e5e5e5;
        }

        .chat-item-row.active {
            background-color: #1a1a1a;
            border-color: #262626;
            color: #ffffff;
            font-weight: 500;
        }

        .chat-item-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            padding-right: 8px;
        }

        .chat-item-delete {
            opacity: 0.6;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .chat-item-delete:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .chat-item-delete svg path {
            transition: fill 0.15s;
        }

        .chat-item-delete:hover svg path {
            fill: #ef4444;
        }

        /* Sidebar Bottom Profile */
        .sidebar-bottom {
            padding-top: 14px;
            border-top: 1px solid #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #222222;
            border: 1px solid #333333;
        }

        .profile-meta {
            display: flex;
            flex-direction: column;
        }

        .profile-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
        }

        .profile-badge {
            font-size: 11px;
            color: #888888;
        }

        .logout-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .logout-btn:hover {
            opacity: 0.8;
        }

        /* ─── MAIN CHAT AREA (CENTERED 800PX • FLEX COLUMN) ──────────────── */
        .main-chat-container {
            flex: 1;
            height: 100%;
            height: 100dvh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: #000000;
            overflow: hidden;
        }

        /* Figma Ellipse Glow Layer (W: 661px, H: 88px, Fill: #1133A3 100%, Blur: 340) */
        .bg-ellipse-glow {
            position: absolute;
            width: 661px;
            height: 88px;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            background: #1133A3;
            border-radius: 50%;
            filter: blur(140px);
            -webkit-filter: blur(140px);
            opacity: 0.95;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .bg-ellipse-glow.hidden-glow {
            opacity: 0;
            visibility: hidden;
        }

        /* Messages Scroll Window (Flex: 1 fills the middle) */
        .messages-viewport {
            position: relative;
            z-index: 2;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            scroll-behavior: smooth;
        }

        .centered-chat-content {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 30px 16px 50px 16px;
            min-height: 100%;
        }

        /* Empty State Hero Screen */
        .empty-state-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: auto 0;
            padding: 40px 16px 20px 16px;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }

        .empty-hero-logo {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: #1133A3;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            box-shadow: 0 12px 32px rgba(17, 51, 163, 0.4);
        }

        .empty-hero-title {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
            letter-spacing: -0.4px;
        }

        .empty-hero-subtitle {
            font-size: 14px;
            color: #7e7e84;
            max-width: 530px;
            line-height: 1.65;
            margin: 0 auto;
        }

        /* User Message Bubble */
        .user-message-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-left: auto;
            max-width: 480px;
            width: fit-content;
            animation: fadeIn 0.25s ease;
        }

        .user-image-attachment {
            max-width: 240px;
            max-height: 200px;
            border-radius: 14px;
            margin-bottom: 8px;
            border: 1px solid #222222;
            object-fit: cover;
            cursor: pointer;
        }

        .user-bubble {
            background-color: #1133A3;
            color: #ffffff;
            border-radius: 18px;
            padding: 12px 18px;
            font-size: 14.5px;
            line-height: 1.55;
            word-break: break-word;
            box-shadow: 0 4px 16px rgba(17, 51, 163, 0.25);
        }

        /* AI Message Bubble */
        .ai-message-wrapper {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            animation: fadeIn 0.25s ease;
        }

        .ai-bubble {
            background-color: #0F0F0F;
            border: 1px solid #222222;
            border-radius: 18px;
            padding: 22px 26px;
            font-size: 14.5px;
            line-height: 1.7;
            color: #d1d5db;
            word-break: break-word;
        }

        .ai-bubble p { margin-bottom: 10px; }
        .ai-bubble p:last-child { margin-bottom: 0; }
        .ai-bubble strong { color: #ffffff; font-weight: 700; }
        .ai-bubble h1, .ai-bubble h2, .ai-bubble h3, .ai-bubble h4 {
            color: #ffffff;
            font-weight: 700;
            margin-top: 14px;
            margin-bottom: 8px;
        }
        .ai-bubble ul, .ai-bubble ol {
            margin: 10px 0;
            padding-left: 22px;
        }
        .ai-bubble li {
            margin-bottom: 5px;
        }
        .ai-bubble blockquote {
            border-left: 3px solid #1133A3;
            padding-left: 12px;
            margin: 10px 0;
            color: #9ca3af;
        }
        .ai-bubble code {
            background-color: #171717;
            border: 1px solid #292929;
            padding: 2px 6px;
            border-radius: 6px;
            color: #60a5fa;
            font-size: 13px;
        }

        /* Typing Dots */
        .typing-container {
            display: flex;
            gap: 5px;
            padding: 4px 0;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background-color: #1133A3;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-6px); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── BOTTOM INPUT SECTION (CENTERED 800PX • NATURAL FLEX FOOTER) ─────────── */
        .input-dock {
            position: relative;
            flex-shrink: 0;
            width: 100%;
            background-color: #000000;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 20px max(12px, env(safe-area-inset-bottom, 12px)) 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 20;
        }

        .input-dock-inner {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Image preview container */
        .image-preview-dock {
            display: none;
            align-items: center;
            gap: 10px;
            background-color: #0F0F0F;
            border: 1px solid #222222;
            border-radius: 14px;
            padding: 8px 12px;
            width: fit-content;
        }

        .image-preview-dock.active { display: flex; }

        .image-thumb {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #333333;
        }

        .image-info {
            font-size: 12px;
            color: #d1d5db;
        }

        .image-close-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 4px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Input Capsule Bar */
        .input-capsule {
            background-color: #0F0F0F;
            border: 1px solid #222222;
            border-radius: 9999px;
            padding: 6px 8px 6px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .input-capsule:focus-within {
            border-color: #333333;
            box-shadow: 0 0 0 1px #333333, 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .gallery-attach-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .gallery-attach-btn:hover {
            transform: scale(1.08);
            opacity: 0.9;
        }

        .gallery-attach-btn.has-file svg path {
            stroke: #10b981;
        }

        .input-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 14.5px;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
            padding: 8px 0;
        }

        .input-textarea::placeholder {
            color: #737373;
            font-size: 14px;
        }

        .send-round-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #1133A3;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-round-btn:hover {
            transform: scale(1.05);
            background-color: #143bc0;
            box-shadow: 0 4px 14px rgba(17, 51, 163, 0.4);
        }

        .send-round-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .disclaimer-caption {
            font-size: 11px;
            color: #555555;
            text-align: center;
            padding-top: 4px;
        }

        /* Fullscreen Modal */
        .fullscreen-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .fullscreen-modal.open { display: flex; }

        .fullscreen-modal img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 14px;
            border: 1px solid #333333;
        }

        /* Mobile Top Navigation Bar */
        /* Mobile Top Navigation Bar */
        .mobile-top-bar {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: calc(56px + env(safe-area-inset-top, 0px));
            padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 8px 16px;
            align-items: center;
            justify-content: space-between;
            z-index: 40;
            pointer-events: none;
        }

        .mobile-top-bar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #000000 0%, rgba(0, 0, 0, 0.75) 60%, rgba(0, 0, 0, 0) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
            z-index: -1;
        }

        .mobile-top-bar > * {
            pointer-events: auto;
        }

        .mobile-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .mobile-icon-btn {
            background: rgba(22, 22, 22, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .mobile-icon-btn:active {
            transform: scale(0.94);
            background: rgba(40, 40, 40, 0.9);
        }

        /* Sidebar Backdrop Overlay */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 55;
            backdrop-filter: blur(3px);
        }

        .sidebar-backdrop.active {
            display: block;
        }

        /* Mobile Responsive Breakpoint (Figma Mobile Design: Linear #000000 Gradient & Progressive Background Blur 10px) */
        @media (max-width: 860px) {
            .mobile-top-bar { display: flex; }

            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                margin: 10px;
                height: calc(100dvh - 20px);
                height: calc(100vh - 20px);
                z-index: 60;
                box-shadow: 0 0 50px rgba(0,0,0,0.9);
                transform: translateX(-330px);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            /* Messages scroll area passing behind top and bottom progressive blur */
            .messages-viewport {
                padding: 0;
                width: 100%;
                height: 100%;
            }

            .centered-chat-content {
                padding: calc(68px + env(safe-area-inset-top, 0px)) 16px calc(95px + env(safe-area-inset-bottom, 12px)) 16px;
                gap: 16px;
            }

            /* Floating Input Dock with Figma Linear Gradient & Progressive Background Blur (Start 10, End 0) */
            .input-dock {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                background: transparent;
                border-top: none;
                padding: 8px 16px calc(14px + env(safe-area-inset-bottom, 12px)) 16px;
                z-index: 40;
                pointer-events: none;
            }

            .input-dock::before {
                content: '';
                position: absolute;
                inset: -28px 0 0 0;
                background: linear-gradient(0deg, #000000 0%, rgba(0, 0, 0, 0.8) 60%, rgba(0, 0, 0, 0) 100%);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                mask-image: linear-gradient(to top, black 65%, transparent 100%);
                -webkit-mask-image: linear-gradient(to top, black 65%, transparent 100%);
                z-index: -1;
            }

            .input-dock > * {
                pointer-events: auto;
            }

            .input-capsule {
                background: rgba(18, 18, 18, 0.92);
                border: 1px solid rgba(255, 255, 255, 0.12);
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }

            .user-message-wrapper {
                max-width: 88%;
            }

            .user-bubble {
                font-size: 14.5px;
                padding: 11px 16px;
            }

            /* Clean borderless AI text on dark background as in Figma mockup */
            .ai-bubble {
                background: transparent;
                border: none;
                padding: 4px 0;
                font-size: 15px;
                line-height: 1.65;
                color: #d1d5db;
            }

            .ai-bubble h1, .ai-bubble h2, .ai-bubble h3, .ai-bubble h4, .ai-bubble strong {
                color: #ffffff;
                font-weight: 700;
            }

            .empty-state-hero {
                padding: 20px 16px;
            }

            .empty-hero-title {
                font-size: 22px;
            }

            .empty-hero-subtitle {
                font-size: 13px;
                line-height: 1.6;
            }
        }
    </style>
</head>
<body>

<!-- Mobile Sidebar Backdrop Overlay -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

<!-- ─── SIDEBAR (290px • #0F0F0F • border #222222) ─────── -->
<aside class="sidebar" id="sidebar">
    <!-- Brand Header -->
    <div class="sidebar-brand">
        <div class="brand-icon-wrap">
            <img src="/icon/logo.png" style="width: 26px; height: 26px; object-fit: contain;" alt="Logo">
        </div>
        <span class="brand-title">Inspektor AI</span>
    </div>

    <!-- New Chat Button -->
    <button class="new-chat-card" onclick="createNewChat()">
        <span>Yangi chat yaratish</span>
        <!-- icon/edit.svg -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="16" height="16" rx="4" stroke="#878787" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14.7 7.7C15.09 7.31 15.72 7.31 16.11 7.7C16.5 8.09 16.5 8.72 16.11 9.11L9.8 15.42C9.61 15.61 9.36 15.72 9.09 15.72H8.25V14.88C8.25 14.61 8.36 14.36 8.55 14.17L14.7 7.7Z" stroke="#878787" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <!-- Chat History List -->
    <div class="chat-list-scroll" id="chatListContainer">
        <!-- Dinamik ravishda JS orqali to'ldiriladi -->
    </div>

    <!-- Bottom User Profile -->
    <div class="sidebar-bottom">
        <div class="profile-left">
            <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231f2937'/><circle cx='50' cy='40' r='20' fill='%239ca3af'/><circle cx='50' cy='95' r='35' fill='%239ca3af'/></svg>"
                 class="profile-avatar"
                 alt="Atabayev Anvar">
            <div class="profile-meta">
                <span class="profile-name">Atabayev Anvar</span>
                <span class="profile-badge">PRO Tarif</span>
            </div>
        </div>
        <button class="logout-btn" onclick="clearAllChats(event)" title="Barcha chatlarni tozalash">
            <!-- icon/export.svg -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.5005 9.31995L20.0605 11.8799L17.5005 14.4399" stroke="#878787" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>

<div class="fullscreen-modal" id="imageModal" onclick="closeImageModal()">

<!-- ─── SCRIPT ─────────────────────────────────────────── -->
<script>
    marked.setOptions({ breaks: true, gfm: true });

    const STORAGE_CHATS_KEY = 'inspektor_ai_chats_v2';
    const STORAGE_ACTIVE_KEY = 'inspektor_ai_active_id_v2';

    let chats = [];
    let activeChatId = null;
    let isLoading = false;
    let selectedImageFile = null;
    let selectedImageDataUrl = null;

    // DOM References
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const bgEllipseGlow = document.getElementById('bgEllipseGlow');
    const chatListContainer = document.getElementById('chatListContainer');
    const messagesViewport = document.getElementById('messagesViewport');
    const chatContent = document.getElementById('chatContent');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const attachBtn = document.getElementById('attachBtn');
    const imageFileInput = document.getElementById('imageFileInput');
    const imagePreviewDock = document.getElementById('imagePreviewDock');
    const imageThumb = document.getElementById('imageThumb');
    const imageInfo = document.getElementById('imageInfo');

    // ─── INITIALIZATION ─────────────────────────────────────
    function init() {
        loadChatsFromStorage();
        if (chats.length === 0) {
            createNewChat(false);
        } else {
            const savedActiveId = localStorage.getItem(STORAGE_ACTIVE_KEY);
            const found = chats.find(c => c.id === savedActiveId);
            if (found) {
                switchActiveChat(savedActiveId);
            } else {
                switchActiveChat(chats[0].id);
            }
        }
        renderChatList();
    }

    // ─── STORAGE ────────────────────────────────────────────
    function loadChatsFromStorage() {
        try {
            const data = localStorage.getItem(STORAGE_CHATS_KEY);
            chats = data ? JSON.parse(data) : [];
        } catch (e) {
            chats = [];
        }
    }

    function saveChatsToStorage() {
        try {
            localStorage.setItem(STORAGE_CHATS_KEY, JSON.stringify(chats));
            localStorage.setItem(STORAGE_ACTIVE_KEY, activeChatId || '');
        } catch (e) {
            console.error('Storage error:', e);
        }
    }

    // ─── CHAT SESSION MANAGEMENT ────────────────────────────
    function createNewChat(autoFocus = true) {
        const newId = 'chat_' + Date.now();
        const newChat = {
            id: newId,
            title: 'Yangi chat',
            createdAt: Date.now(),
            messages: []
        };

        chats.unshift(newChat);
        activeChatId = newId;
        saveChatsToStorage();
        renderChatList();
        renderActiveChatMessages();
        closeMobileSidebar();

        if (autoFocus) {
            chatInput.focus();
        }
    }

    function switchActiveChat(chatId) {
        activeChatId = chatId;
        saveChatsToStorage();
        renderChatList();
        renderActiveChatMessages();
        removeImage();
        closeMobileSidebar();
    }

    function deleteChat(chatId, e) {
        if (e) e.stopPropagation();
        chats = chats.filter(c => c.id !== chatId);
        if (activeChatId === chatId) {
            if (chats.length > 0) {
                activeChatId = chats[0].id;
            } else {
                createNewChat(false);
                return;
            }
        }
        saveChatsToStorage();
        renderChatList();
        renderActiveChatMessages();
    }

    function clearAllChats(e) {
        if (e) e.stopPropagation();
        if (confirm("Barcha suhbatlar tarixini o'chirib yubormoqchimisiz?")) {
            chats = [];
            createNewChat();
        }
    }

    function getActiveChat() {
        return chats.find(c => c.id === activeChatId);
    }

    // ─── RENDER CHAT LIST IN SIDEBAR ─────────────────────────
    function renderChatList() {
        chatListContainer.innerHTML = '';

        if (chats.length === 0) {
            chatListContainer.innerHTML = `
                <div style="font-size:12px; color:#555555; padding:12px 10px; text-align:center;">
                    Hozircha chatlar yo'q
                </div>`;
            return;
        }

        chats.forEach(chat => {
            const item = document.createElement('div');
            item.className = `chat-item-row ${chat.id === activeChatId ? 'active' : ''}`;
            item.onclick = () => switchActiveChat(chat.id);

            item.innerHTML = `
                <span class="chat-item-text" title="${escapeHtml(chat.title)}">
                    ${escapeHtml(chat.title)}
                </span>
                <button class="chat-item-delete" onclick="deleteChat('${chat.id}', event)" title="O'chirish">
                    <!-- icon/trash.svg -->
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.9997 6.72998C20.9797 6.72998 20.9497 6.72998 20.9197 6.72998C15.6297 6.19998 10.3497 5.99998 5.11967 6.52998L3.07967 6.72998C2.65967 6.76998 2.28967 6.46998 2.24967 6.04998C2.20967 5.62998 2.50967 5.26998 2.91967 5.22998L4.95967 5.02998C10.2797 4.48998 15.6697 4.69998 21.0697 5.22998C21.4797 5.26998 21.7797 5.63998 21.7397 6.04998C21.7097 6.43998 21.3797 6.72998 20.9997 6.72998Z" fill="#585858"/>
                        <path d="M8.50074 5.72C8.46074 5.72 8.42074 5.72 8.37074 5.71C7.97074 5.64 7.69074 5.25 7.76074 4.85L7.98074 3.54C8.14074 2.58 8.36074 1.25 10.6907 1.25H13.3107C15.6507 1.25 15.8707 2.63 16.0207 3.55L16.2407 4.85C16.3107 5.26 16.0307 5.65 15.6307 5.71C15.2207 5.78 14.8307 5.5 14.7707 5.1L14.5507 3.8C14.4107 2.93 14.3807 2.76 13.3207 2.76H10.7007C9.64074 2.76 9.62074 2.9 9.47074 3.79L9.24074 5.09C9.18074 5.46 8.86074 5.72 8.50074 5.72Z" fill="#585858"/>
                        <path d="M15.2104 22.75H8.79039C5.30039 22.75 5.16039 20.82 5.05039 19.26L4.40039 9.18995C4.37039 8.77995 4.69039 8.41995 5.10039 8.38995C5.52039 8.36995 5.87039 8.67995 5.90039 9.08995L6.55039 19.16C6.66039 20.68 6.70039 21.25 8.79039 21.25H15.2104C17.3104 21.25 17.3504 20.68 17.4504 19.16L18.1004 9.08995C18.1304 8.67995 18.4904 8.36995 18.9004 8.38995C19.3104 8.41995 19.6304 8.76995 19.6004 9.18995L18.9504 19.26C18.8404 20.82 18.7004 22.75 15.2104 22.75Z" fill="#585858"/>
                    </svg>
                </button>
            `;
            chatListContainer.appendChild(item);
        });
    }

    // ─── RENDER ACTIVE CHAT MESSAGES ────────────────────────
    function renderActiveChatMessages() {
        const currentChat = getActiveChat();
        chatContent.innerHTML = '';

        if (!currentChat || currentChat.messages.length === 0) {
            if (bgEllipseGlow) bgEllipseGlow.classList.remove('hidden-glow');
            chatContent.innerHTML = `
                <div class="empty-state-hero">
                    <div class="empty-hero-logo" style="background: transparent; box-shadow: none; width: auto; height: auto;">
                        <img src="/icon/logo.png" style="width: 72px; height: 72px; object-fit: contain;" alt="Inspektor AI Logo">
                    </div>
                    <h1 class="empty-hero-title">Inspektor AI</h1>
                    <p class="empty-hero-subtitle">
                        Yo'l harakati qoidalari bo'chi istalgan savolingizga javob olishinigiz mumkin. Javoblar faqat O'zbekiston Respublikasi Yo'l Harakati qoidali ning 186 bandi va atamalari ga asosan holda beriladi
                    </p>
                </div>
            `;
            return;
        }

        // Agar xabarlar bo'lsa orqafondagi glow yo'qoladi va qora bo'ladi
        if (bgEllipseGlow) bgEllipseGlow.classList.add('hidden-glow');

        currentChat.messages.forEach(msg => {
            if (msg.role === 'user') {
                appendUserMessageToDOM(msg.text, msg.imageUrl);
            } else {
                appendAIMessageToDOM(msg.text);
            }
        });

        scrollChatToBottom();
    }

    // ─── DOM MESSAGE RENDERING ──────────────────────────────
    function appendUserMessageToDOM(text, imageUrl) {
        const wrapper = document.createElement('div');
        wrapper.className = 'user-message-wrapper';

        let imgHtml = '';
        if (imageUrl) {
            imgHtml = `<img class="user-image-attachment" src="${imageUrl}" alt="Rasm" onclick="openImageModal('${imageUrl}')">`;
        }

        wrapper.innerHTML = `
            ${imgHtml}
            <div class="user-bubble">
                ${escapeHtml(text)}
            </div>
        `;

        chatContent.appendChild(wrapper);
        scrollChatToBottom();
    }

    function appendAIMessageToDOM(text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'ai-message-wrapper';

        const parsedContent = marked.parse(text);

        wrapper.innerHTML = `
            <div class="ai-bubble">
                ${parsedContent}
            </div>
        `;

        chatContent.appendChild(wrapper);
        scrollChatToBottom();
    }

    // So'zma-so'z oqib chiqadigan Typewriter animatsiyasi
    async function typewriteAIMessage(fullText) {
        const wrapper = document.createElement('div');
        wrapper.className = 'ai-message-wrapper';

        const bubble = document.createElement('div');
        bubble.className = 'ai-bubble';
        wrapper.appendChild(bubble);

        chatContent.appendChild(wrapper);
        scrollChatToBottom();

        // So'zlar va bo'shliqlarga bo'lish
        const tokens = fullText.split(/(\s+)/);
        let currentText = '';
        let i = 0;

        return new Promise((resolve) => {
            function step() {
                // Har bir qadamda 2 tadan token qo'shiladi (tezkor va silliq oqim)
                const stepCount = 2;
                for (let k = 0; k < stepCount && i < tokens.length; k++) {
                    currentText += tokens[i];
                    i++;
                }

                bubble.innerHTML = marked.parse(currentText);
                scrollChatToBottom();

                if (i < tokens.length) {
                    setTimeout(step, 16);
                } else {
                    bubble.innerHTML = marked.parse(fullText);
                    scrollChatToBottom();
                    resolve();
                }
            }
            step();
        });
    }

    function showTypingDOM() {
        const wrapper = document.createElement('div');
        wrapper.className = 'ai-message-wrapper';
        wrapper.id = 'activeTyping';
        wrapper.innerHTML = `
            <div class="ai-bubble" style="width:fit-content; padding: 14px 20px;">
                <div class="typing-container">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>
        `;
        chatContent.appendChild(wrapper);
        scrollChatToBottom();
        return wrapper;
    }

    // ─── SENDING MESSAGES ───────────────────────────────────
    async function sendCurrentMessage() {
        const text = chatInput.value.trim();
        const hasImage = selectedImageFile !== null;

        if (!text && !hasImage) return;
        if (isLoading) return;

        let currentChat = getActiveChat();
        if (!currentChat) {
            createNewChat(false);
            currentChat = getActiveChat();
        }

        const userText = text || "Ushbu yo'l rasmini tahlil qiling.";
        const imageUrlForHistory = selectedImageDataUrl;
        const fileToSend = selectedImageFile;

        // Auto-title on first message
        if (currentChat.messages.length === 0) {
            chatContent.innerHTML = '';
            if (bgEllipseGlow) bgEllipseGlow.classList.add('hidden-glow');
            let autoTitle = text.slice(0, 26);
            if (text.length > 26) autoTitle += '...';
            if (!autoTitle) autoTitle = "Rasm tahlili";
            currentChat.title = autoTitle;
            renderChatList();
        }

        // Add to state
        currentChat.messages.push({
            role: 'user',
            text: userText,
            imageUrl: imageUrlForHistory
        });
        saveChatsToStorage();

        // Render to DOM
        appendUserMessageToDOM(userText, imageUrlForHistory);

        // Reset inputs
        chatInput.value = '';
        adjustTextareaHeight(chatInput);
        removeImage();

        // Start loading
        isLoading = true;
        sendBtn.disabled = true;
        const typingEl = showTypingDOM();

        try {
            let data;
            if (fileToSend) {
                const formData = new FormData();
                formData.append('message', userText);
                formData.append('session_id', currentChat.id);
                formData.append('image', fileToSend);

                const res = await fetch('/api/chat-image', {
                    method: 'POST',
                    body: formData
                });
                data = await res.json();
            } else {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: userText,
                        session_id: currentChat.id
                    })
                });
                data = await res.json();
            }

            typingEl.remove();

            const aiReply = data.reply || "Javob hosil qilishda muammo bo'ldi.";
            currentChat.messages.push({
                role: 'ai',
                text: aiReply
            });
            saveChatsToStorage();

            // So'zma-so'z oqib chiqadigan animatsiya
            await typewriteAIMessage(aiReply);

        } catch (error) {
            typingEl.remove();
            appendAIMessageToDOM("Xatolik yuz berdi. Internet aloqangizni tekshirib, qayta urinib ko'ring.");
        } finally {
            isLoading = false;
            sendBtn.disabled = false;
            chatInput.focus();
        }
    }

    // ─── IMAGE SELECTION ────────────────────────────────────
    function handleImageSelection(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            alert("Faqat rasm fayllari qabul qilinadi!");
            return;
        }

        if (file.size > 10 * 1024 * 1024) {
            alert("Rasm hajmi 10 MB dan oshmasligi kerak!");
            return;
        }

        selectedImageFile = file;

        const reader = new FileReader();
        reader.onload = function(evt) {
            selectedImageDataUrl = evt.target.result;
            imageThumb.src = selectedImageDataUrl;
            imageInfo.textContent = file.name;
            imagePreviewDock.classList.add('active');
            attachBtn.classList.add('has-file');
        };
        reader.readAsDataURL(file);
        chatInput.focus();
    }

    function removeImage() {
        selectedImageFile = null;
        selectedImageDataUrl = null;
        imageFileInput.value = '';
        imagePreviewDock.classList.remove('active');
        attachBtn.classList.remove('has-file');
    }

    // ─── MODAL ──────────────────────────────────────────────
    function openImageModal(url) {
        document.getElementById('fullscreenImg').src = url;
        document.getElementById('imageModal').classList.add('open');
    }

    function closeImageModal() {
        document.getElementById('imageModal').classList.remove('open');
    }

    // ─── SIDEBAR TOGGLE ─────────────────────────────────────
    function toggleSidebar() {
        if (window.innerWidth <= 860) {
            sidebar.classList.toggle('mobile-open');
            if (sidebarBackdrop) {
                sidebarBackdrop.classList.toggle('active', sidebar.classList.contains('mobile-open'));
            }
        } else {
            sidebar.classList.toggle('collapsed');
        }
    }

    function closeMobileSidebar() {
        if (window.innerWidth <= 860) {
            sidebar.classList.remove('mobile-open');
            if (sidebarBackdrop) {
                sidebarBackdrop.classList.remove('active');
            }
        }
    }

    // ─── UTILS ──────────────────────────────────────────────
    function scrollChatToBottom(smooth = false) {
        if (!messagesViewport) return;
        if (smooth) {
            messagesViewport.scrollTo({
                top: messagesViewport.scrollHeight + 1000,
                behavior: 'smooth'
            });
        } else {
            messagesViewport.scrollTop = messagesViewport.scrollHeight + 1000;
        }
    }

    function handleInputKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendCurrentMessage();
        }
    }

    function adjustTextareaHeight(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    }

    // Drag & Drop
    document.addEventListener('dragover', (e) => { e.preventDefault(); });
    document.addEventListener('drop', (e) => {
        e.preventDefault();
        const files = e.dataTransfer.files;
        if (files.length > 0 && files[0].type.startsWith('image/')) {
            imageFileInput.files = files;
            handleImageSelection({ target: imageFileInput });
        }
    });

    // Paste from clipboard (Ctrl+V)
    document.addEventListener('paste', (e) => {
        const items = e.clipboardData.items;
        for (let item of items) {
            if (item.type.startsWith('image/')) {
                const file = item.getAsFile();
                const dt = new DataTransfer();
                dt.items.add(file);
                imageFileInput.files = dt.files;
                handleImageSelection({ target: imageFileInput });
                break;
            }
        }
    });

    // Start App
    window.onload = init;
</script>
